<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<title>Viigipuud Eestis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="images/ui/fig-icon.png">

<!-- OPEN GRAPH -->
<meta property="og:title" content="Viigipuud Eestis">
<meta property="og:description" content="Varased viigipuusordid Eesti tingimustesse. Vaata sorte ja pilte.">
<meta property="og:image" content="https://raw.githubusercontent.com/muttaja/Viigid/main/images/preview/preview.jpg">
<meta property="og:url" content="https://ficus.ee">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ficus.ee">

<!-- TWITTER -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Viigipuud Eestis">
<meta name="twitter:description" content="Varased viigipuusordid Eesti tingimustesse.">
<meta name="twitter:image" content="https://raw.githubusercontent.com/muttaja/Viigid/main/images/preview/preview.jpg">

<style>
:root{
    --bg:#f3f6f2;
    --card:#ffffff;
    --text:#333;
    --green:#2e7d32;
}

@media (prefers-color-scheme: dark){
:root{
    --bg:#1e1e1e;
    --card:#2a2a2a;
    --text:#e8e8e8;
}
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    text-align:center;
}

.container{
    padding:30px 15px;
    max-width:1100px;
    margin:auto;
}

h1{
    margin-bottom:10px; /* Vähendasin veidi vahet, et link mahuks ilusti alla */
}

/* UUE LINGI STIIL */
.guide-link {
    display: inline-block;
    margin-bottom: 25px;
    font-size: 18px;
    font-weight: bold;
    color: var(--green);
    text-decoration: none;
    transition: opacity 0.2s;
}

.guide-link:hover {
    text-decoration: underline;
    opacity: 0.8;
}

@media (prefers-color-scheme: dark){
.guide-link {
    color: #4caf50; /* Pimedas režiimis veidi heledam roheline parema loetavuse jaoks */
}
}

/* SLIDER */
.slider{
    position:relative;
    margin:auto;
    max-width:900px;
}

/* SLAIDIDE UUS LOOGIKA */
.slide{
    display:none; /* Peidame vaikimisi kõik slaidid */
    background:var(--card);
    border-radius:14px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
    overflow:hidden;
}

.slide.active{
    display:block; /* Näitame ainult aktiivset slaidi */
    animation: fadeIn 0.4s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0.3; }
    to { opacity: 1; }
}

.slide-image{
    width:100%;
    height:500px;
    background:#00000010;
    display:flex;
    align-items:center;
    justify-content:center;
}

.slide-image img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

.slide-content{
    padding:20px;
    text-align:left;
    min-height:150px;
}

.slide a{
    color:inherit;
    text-decoration:none;
}

.slide-desc{
    display:-webkit-box;
    -webkit-line-clamp:1;
    -webkit-box-orient:vertical;
    overflow:hidden;
    line-height:1.4em;
    height:1.4em;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
    font-size:14px;
    margin-top:10px;
}

.arrow{
    background:none;
    border:none;
    cursor:pointer;
    position:absolute;
    top:45%;
    transform:translateY(-50%);
    z-index:10;
}

.arrow img{
    width:95px;
}

.arrow-right{ left:-120px; }
.arrow-left{ right:-120px; }

@media (max-width:900px){
.arrow{
    display:none;
}
.slide-image{
    height:300px;
}
}

.dots{
    margin-top:12px;
}

.dot{
    display:inline-block;
    width:8px;
    height:8px;
    margin:4px;
    background:#aaa;
    border-radius:50%;
}

.dot.active{
    background:#555;
}

.counter{
    margin-top:4px;
    font-size:13px;
    opacity:0.7;
}

.button{
    display:inline-block;
    margin:15px 0;
    padding:14px 26px;
    font-size:18px;
    color:white;
    background:var(--green);
    text-decoration:none;
    border-radius:8px;
}

.fb-banner{
    margin:10px auto;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    max-width:750px;
}

.fb-banner img{
    width:100%;
    display:block;
}
</style>
</head>

<body>

<div class="container">
<h1>Viigipuud Eestis</h1>

<!-- LISATUD LINK -->
<a href="figging.html" class="guide-link">Mis, miks? Kus, kuidas? Loe juhtnööre →</a>

<div class="slider" id="sliderArea">

<button class="arrow arrow-right" onclick="prevSlide()" aria-label="Eelmine">
    <img src="images/ui/leaf-right.png">
</button>
<button class="arrow arrow-left" onclick="nextSlide()" aria-label="Järgmine">
    <img src="images/ui/leaf-left.png">
</button>

<div id="slideContainer">Laadimine...</div>
<div class="dots" id="dots"></div>
<div class="counter" id="counter"></div>

</div>

<a class="button" href="catalogue.html">
Vaata kõiki saadaval sorte
</a>

<a href="https://www.facebook.com/groups/1096702358191767/" target="_blank" rel="noopener noreferrer">
<div class="fb-banner">
<img src="../images_fb/banner.png" fetchpriority="high">
</div>
</a>

<p>Huvi korral kirjuta mats.ploompuu@gmail.com või Messengeris.</p>
<p>Taimetervise registri number koos taimepassi tegevusloaga nr 5455.</p>

</div>

<script>
let figs = [];
let current = 0;
let slideTimer;
let startX = 0;
let startY = 0;

async function loadSlides(){
    try {
        const [txtRes, jsonRes] = await Promise.all([
            fetch("../for_slides/for_slides.txt"),
            fetch("figs.json")
        ]);

        const text = await txtRes.text();
        const data = await jsonRes.json();
        const slideList = text.split("\n").map(s=>s.trim()).filter(Boolean);

        figs = slideList.map(id => data.find(x => x.id === id)).filter(Boolean);

        if(figs.length > 0) {
            renderAllSlides(); 
            createDots();
            showSlide();
            resetTimer();
        }
    } catch (err) {
        console.error("Viga laadimisel:", err);
        document.getElementById("slideContainer").innerHTML = "Andmete laadimine ebaõnnestus.";
    }
}

function renderAllSlides() {
    const container = document.getElementById("slideContainer");
    let slidesHTML = '';

    figs.forEach((f, index) => {
        const imgPath = `https://raw.githubusercontent.com/muttaja/Viigid/main/for_slides/img/${f.id}.jpg`;
        const priority = index === 0 ? 'fetchpriority="high"' : 'loading="lazy"';
        
        slidesHTML += `
        <div class="slide" id="slide-${index}">
            <a href="variety.html?id=${f.id}">
                <div class="slide-image">
                    <img src="${imgPath}" ${priority} alt="${f.name}">
                </div>
            </a>
            <div class="slide-content">
                <h2>
                    <a href="variety.html?id=${f.id}">
                        ${f.name}
                    </a>
                    ${f.saadavus=="jah" ? '<span style="color:lightgreen;"> (saadaval)</span>' : ''}
                </h2>

                <p class="slide-desc">${f.kirjeldus || ""}</p>

                <div class="info-grid">
                    <div><b>Varasus:</b> ${f.varasus}</div>
                    <div><b>Maitsev:</b> ${f.maitsev}</div>
                    <div><b>Suurus:</b> ${f.suurus}</div>
                    <div><b>Külmakindlus:</b> ${f.kulmakindlus}</div>
                    <div><b>Värvus:</b> ${f.varvus}</div>
                    <div><b>Riik:</b> ${f.riik}</div>
                </div>
            </div>
        </div>`;
    });

    container.innerHTML = slidesHTML;
}

function showSlide(){
    const slides = document.querySelectorAll('.slide');
    slides.forEach((slide, index) => {
        if(index === current) {
            slide.classList.add('active');
        } else {
            slide.classList.remove('active');
        }
    });

    updateDots();
    document.getElementById("counter").innerText = (current+1) + " / " + figs.length;
}

function resetTimer() {
    clearInterval(slideTimer);
    slideTimer = setInterval(nextSlide, 6000);
}

function nextSlide(){
    current = (current + 1) % figs.length;
    showSlide();
    resetTimer();
}

function prevSlide(){
    current = (current - 1 + figs.length) % figs.length;
    showSlide();
    resetTimer();
}

function createDots(){
    const dots = document.getElementById("dots");
    dots.innerHTML = figs.map(() => `<span class="dot"></span>`).join('');
}

function updateDots(){
    const dots = document.querySelectorAll(".dot");
    dots.forEach((d, i) => d.classList.toggle("active", i === current));
}

// Swipe tugi
const sliderArea = document.getElementById("sliderArea");
sliderArea.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    resetTimer(); 
}, {passive: true});

sliderArea.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;
    let diffX = endX - startX;
    let diffY = endY - startY;

    if(Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50){
        if(diffX > 0) prevSlide(); else nextSlide();
    }
}, {passive: true});

loadSlides();
</script>

</body>
</html>
