<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<title>Viigipuud Eestis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="images/ui/fig-icon.png">
<link rel="shortcut icon" href="images/ui/fig-icon.png">
<link rel="apple-touch-icon" href="images/ui/fig-icon.png">

<style>
:root{
    --bg:#f3f6f2;
    --card:#ffffff;
    --text:#333;
    --green:#2e7d32;
}

@media (prefers-color-scheme: dark){
:root{
    --bg:#1e1e1e;
    --card:#2a2a2a;
    --text:#e8e8e8;
}
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:var(--card);
    border-radius:14px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
    padding:20px;
    position: relative;
}

h1{
    margin-bottom:5px;
}

p{
    margin-top:5px;
    margin-bottom:15px;
    line-height: 1.5em;
}

/* TOOLTIP */
.q{
    display:inline-block;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#2e7d32;
    color:white;
    font-size:10px;
    line-height:14px;
    text-align:center;
    margin-left:4px;
    position:relative;
    cursor:help;
    text-decoration:none;
}

.q:hover::after{
    content: attr(data-text);
    position:absolute;
    left:18px;
    top:-5px;
    background:#333;
    color:white;
    padding:10px;
    border-radius:6px;
    width:220px;
    font-size:12px;
    line-height:1.4em;
    z-index:100;
    text-align: left;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* VÄLDIB TOOLTIPI EKRAANILT VÄLJA MINEKUT PAREMAS VEERUS */
.info-col:nth-child(2) .q:hover::after {
    left: auto;
    right: 18px;
}

/* IMAGE SLIDER */
.image-slider{
    position:relative;
    margin-bottom:15px;
}

.image-frame{
    width:100%;
    height:420px;
    background:#00000015;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    overflow:hidden;
    touch-action: pan-y;
}

.image-frame img{
    max-width:100%;
    max-height:100%;
    cursor:zoom-in;
}

/* ARROWS */
.img-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.5);
    color:white;
    border:none;
    font-size:26px;
    padding:8px 14px;
    cursor:pointer;
    border-radius:6px;
    z-index: 10;
    transition: background 0.2s;
}

.img-arrow:hover {
    background:rgba(0,0,0,0.8);
}

.img-left{ left:10px; }
.img-right{ right:10px; }

/* DOTS */
.img-dots{
    text-align:center;
    margin-top:8px;
}

.img-dot{
    display:inline-block;
    width:8px;
    height:8px;
    margin:0 4px;
    background:#aaa;
    border-radius:50%;
    cursor:pointer;
}

.img-dot.active{
    background:#555;
}

.img-counter{
    text-align:center;
    font-size:13px;
    opacity:0.7;
    margin-top:3px;
}

/* NAV LINKS */
.nav-links{
    margin-top:25px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    gap:40px;
}

.nav-links a{
    color:var(--green);
    text-decoration:none;
}

.nav-links a:hover{
    text-decoration:underline;
}

/* FULLSCREEN */
.fullscreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    touch-action: none;
}

.fullscreen img{
    max-width:95%;
    max-height:95%;
    object-fit: contain;
}

.close-full{
    position:absolute;
    top:20px;
    right:25px;
    color:white;
    font-size:35px;
    cursor:pointer;
    z-index: 10000;
    line-height: 1;
}

/* INFO GRID */
.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:15px;
    font-size:15px;
}

.info-col div{
    margin-bottom:8px;
}

/* ERROR MESSAGE */
.error-msg {
    text-align: center;
    padding: 40px 0;
}

@media (max-width:700px){
.image-frame{
    height:260px;
}
.info-grid{
    font-size: 14px;
}
}
</style>
</head>

<body>

<div class="container">
<div class="card" id="varietyCard">
    <div style="text-align:center; padding:40px;">Laadimine...</div>
</div>
</div>

<script>
let images = []
let currentImg = 0
let startX = 0
let startY = 0
let isFullscreenOpen = false;

function getId(){
    const params = new URLSearchParams(window.location.search)
    return params.get("id")
}

/* LOAD ONLY EXISTING IMAGES */
function loadImages(folder){
    return new Promise(resolve=>{
        let list = []
        let i = 1

        function check(){
            let img = new Image()
            let path = folder + i + ".jpg"

            img.onload = function(){
                list.push(path)
                i++
                check()
            }

            img.onerror = function(){
                resolve(list)
            }

            img.src = path
        }

        check()
    })
}

async function loadVariety(){
    const id = getId()
    const card = document.getElementById("varietyCard")

    if(!id) {
        showError("Sordi ID puudub URL-ist.");
        return;
    }

    try {
        const res = await fetch("figs.json")
        const data = await res.json()

        const f = data.find(x => x.id === id)
        
        if(!f) {
            showError("Sellist sorti ei leitud.");
            return;
        }

        if(f.images && f.images[0].endsWith("/")){
            images = await loadImages(f.images[0])
        } else {
            images = f.images || []
        }

        buildPage(f)
    } catch(err) {
        console.error("Viga andmete laadimisel:", err);
        showError("Andmete laadimine ebaõnnestus.");
    }
}

function showError(msg) {
    document.getElementById("varietyCard").innerHTML = `
        <div class="error-msg">
            <h2>${msg}</h2>
            <br>
            <a href="catalogue.html" style="color:var(--green); text-decoration:none; font-weight:bold;">← Tagasi kataloogi</a>
        </div>
    `;
}

/* BUILD PAGE */
function buildPage(f){
    currentImg = 0
    const card = document.getElementById("varietyCard")

    card.innerHTML = `
        <h1>
            ${f.name}
            ${f.saadavus=="jah" ? '<span style="color:lightgreen;"> (saadaval)</span>' : ''}
        </h1>

        <p>${f.kirjeldus || ""}</p>

        <div class="image-slider" style="display: ${images.length > 0 ? 'block' : 'none'}">
            ${images.length>1 ? '<button class="img-arrow img-left" id="prevBtn" aria-label="Eelmine">‹</button>' : ''}
            ${images.length>1 ? '<button class="img-arrow img-right" id="nextBtn" aria-label="Järgmine">›</button>' : ''}

            <div class="image-frame" id="imageFrame">
                <img id="varImg" src="${images[0] || ''}" alt="${f.name}">
            </div>

            <div class="img-dots" id="dots"></div>
            <div class="img-counter" id="counter"></div>
        </div>

        <div class="info-grid">
            <div class="info-col">
                <div><b>Varasus</b> <a href="legend.html#varasus" class="q" data-text="Viljade valmimine päevades alates viljade moodustumisest. Kõige varasemad sordid ~60 päeva, hilised üle 90 päeva.">?</a>: ${f.varasus}</div>
                <div><b>Suurus</b> <a href="legend.html#suurus" class="q" data-text="Viljade kaal: väike <20g, keskmine 30–50g, suur 50–80g, mega >80g.">?</a>: ${f.suurus}</div>
                <div><b>Värvus</b> <a href="legend.html#varvus" class="q" data-text="Vilja koore värvus küpsena. Eesti tingimustes sageli vähem kirkad.">?</a>: ${f.varvus}</div>
                <div><b>Maitsev</b> <a href="legend.html#maitsev" class="q" data-text="Subjektiivne hinnang vilja maitsele Eesti tingimustes.">?</a>: ${f.maitsev}</div>
            </div>

            <div class="info-col">
                <div><b>Külmakindlus</b> <a href="legend.html#kulmakindlus" class="q" data-text="Külmakindlus võrreldes teiste sortidega, ei tähenda talvekindlust ilma katmata.">?</a>: ${f.kulmakindlus}</div>
                <div><b>Breba</b> <a href="legend.html#breba" class="q" data-text="Kas sort annab saaki eelmise aasta võrsetelt.">?</a>: ${f.breba}</div>
                <div><b>Riik</b> <a href="legend.html#riik" class="q" data-text="Sordi päritoluriik või piirkond.">?</a>: ${f.riik}</div>
                <div><b>Saadavus</b> <a href="legend.html#saadavus" class="q" data-text="Kas istikuid on hetkel või lähiajal saadaval.">?</a>: ${f.saadavus}</div>
            </div>
        </div>

        <div class="nav-links">
            <a href="index.html">← Avalehele</a>
            <a href="catalogue.html">Kataloogi →</a>
        </div>
    `

    if(images.length > 0) setupSlider()
}

/* SLIDER */
function setupSlider(){
    const img = document.getElementById("varImg")
    const dotsDiv = document.getElementById("dots")

    dotsDiv.innerHTML = images.map((_,i)=>`<span class="img-dot" data-i="${i}"></span>`).join("")
    updateDots()

    if(document.getElementById("prevBtn")){
        document.getElementById("prevBtn").onclick = prevImg
        document.getElementById("nextBtn").onclick = nextImg
    }

    document.querySelectorAll(".img-dot").forEach(dot=>{
        dot.onclick = () => {
            currentImg = parseInt(dot.dataset.i)
            img.src = images[currentImg]
            updateDots()
            syncFullscreenImage()
        }
    })

    img.onclick = openFullscreen

    const frame = document.getElementById("imageFrame")

    frame.addEventListener("touchstart", e=>{
        startX = e.touches[0].clientX
        startY = e.touches[0].clientY
    }, {passive: true})

    frame.addEventListener("touchend", e=>{
        let endX = e.changedTouches[0].clientX
        let endY = e.changedTouches[0].clientY

        let diffX = endX - startX
        let diffY = endY - startY

        if(Math.abs(diffX) > Math.abs(diffY)){
            if(diffX > 50) prevImg()
            if(diffX < -50) nextImg()
        }
    }, {passive: true})
}

function nextImg(){
    if(images.length <= 1) return;
    currentImg = (currentImg + 1) % images.length;
    document.getElementById("varImg").src = images[currentImg]
    updateDots()
    syncFullscreenImage()
}

function prevImg(){
    if(images.length <= 1) return;
    currentImg = (currentImg - 1 + images.length) % images.length;
    document.getElementById("varImg").src = images[currentImg]
    updateDots()
    syncFullscreenImage()
}

function updateDots(){
    const dots = document.querySelectorAll(".img-dot")
    dots.forEach(d=>d.classList.remove("active"))
    if(dots[currentImg]) dots[currentImg].classList.add("active")

    document.getElementById("counter").innerText =
        (currentImg+1) + " / " + images.length
}

/* FULLSCREEN */
function openFullscreen(){
    if(images.length === 0) return;
    isFullscreenOpen = true;

    const div = document.createElement("div")
    div.className = "fullscreen"
    div.id = "fullscreenView"
    div.innerHTML = `
        <div class="close-full" id="closeFsBtn">✕</div>
        ${images.length>1 ? '<button class="img-arrow img-left" id="fsPrevBtn">‹</button>' : ''}
        ${images.length>1 ? '<button class="img-arrow img-right" id="fsNextBtn">›</button>' : ''}
        <img id="fsImg" src="${images[currentImg]}">
    `
    document.body.appendChild(div)

    // Events for Fullscreen
    document.getElementById("closeFsBtn").onclick = closeFullscreen;
    
    if(images.length > 1) {
        document.getElementById("fsPrevBtn").onclick = (e) => { e.stopPropagation(); prevImg(); };
        document.getElementById("fsNextBtn").onclick = (e) => { e.stopPropagation(); nextImg(); };
    }

    // Swipe for Fullscreen
    let fsStartX = 0;
    div.addEventListener("touchstart", e => fsStartX = e.touches[0].clientX, {passive: true});
    div.addEventListener("touchend", e => {
        let diffX = e.changedTouches[0].clientX - fsStartX;
        if(Math.abs(diffX) > 50) {
            if(diffX > 0) prevImg(); else nextImg();
        }
    }, {passive: true});
}

function closeFullscreen() {
    isFullscreenOpen = false;
    const fs = document.getElementById("fullscreenView");
    if(fs) fs.remove();
}

function syncFullscreenImage() {
    if(isFullscreenOpen) {
        const fsImg = document.getElementById("fsImg");
        if(fsImg) fsImg.src = images[currentImg];
    }
}

/* KEYBOARD */
document.addEventListener("keydown", function(e){
    if(e.key === "ArrowLeft") prevImg()
    if(e.key === "ArrowRight") nextImg()
    if(e.key === "Escape" && isFullscreenOpen) closeFullscreen()
})

loadVariety()
</script>

</body>
</html>
